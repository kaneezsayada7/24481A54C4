<!DOCTYPE html>
<html>
  <head>
    <title>Simple Intrest Calculator</title>
  </head>
  <body>
    <center>
        <h1 style="color:blue;  ">simple Intrest Calculator</h1>

        <form method ="POST">
            <input type="number" step="any" name="p" id="" placeholder="principle amount">
            <input type="number" step="any" name="t" id="" placeholder="T">
            <input type="number" step="any" name="r" id="" placeholder="R">
            <button type="submit">Calculate Intrest</button>
        </form>
    </center>

    { # display output # }
    {% if result %}
         <hr>
         <h3> Result,</h3>
         <span>principle: {{ p }}</span>
         <span>Rate : {{r}}</span>
         <span>Time : {{t}} </span>
         <span>
            <b> Simple Intrest - {{ result }}</b> <br>
            <b> Total Amount -{{ total }}</b>
         </span>
    {% endif %}
  </body>
</html>
